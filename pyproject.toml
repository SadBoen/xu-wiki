[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xu-wiki"
version = "0.1.0"
description = "Relation-driven three-layer wiki engine for AI agents"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf   = ["pypdf", "pdfplumber"]
parse = ["markitdown[all]"]
nlp   = ["jieba"]
vision = ["Pillow>=10.0"]
all   = ["pypdf", "pdfplumber", "markitdown[all]", "jieba", "Pillow>=10.0"]

[project.scripts]
xu = "xu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xu.skills" = [
    "SKILL.md",
    "references/create.md",
    "references/ingest.md",
    "references/query.md",
    "references/doctor.md",
    "references/config.md",
    "references/error-catalog.md",
]

[tool.xu-wiki]
marker = "xu-wiki-project"
