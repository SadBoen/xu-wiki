[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xu-wiki"
version = "0.1.0"
description = "Relation-driven three-layer wiki engine for AI agents"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
parse = [
    "markitdown[all]",
]
nlp = [
    "jieba",
]

[project.scripts]
xu-wiki = "xu.cli:main"
xu = "xu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xu.skills" = ["SKILL.md"]

[tool.xu-wiki]
marker = "xu-wiki-project"
