[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "xu-wiki"
version = "0.1.0"
description = "Relation-driven three-layer wiki engine for AI agents"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf   = ["pypdf", "pdfplumber"]
parse = ["markitdown[all]"]
nlp   = ["jieba"]
vision = ["Pillow>=10.0"]
all   = ["pypdf", "pdfplumber", "markitdown[all]", "jieba", "Pillow>=10.0"]

[project.scripts]
xu = "xu.cli:main"

[tool.maturin]
features = ["pyo3/auto-initialize"]
module-name = "xu._core"
python-source = "python"
