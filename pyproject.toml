[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xu-wiki"
version = "0.1.0"
description = "Relation-driven three-layer wiki engine for AI agents"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
parse = [
    "markitdown[all]",
]
nlp = [
    "jieba",
]
# Pillow is a soft dep: album metadata extraction (resolution / GPS / DateTime)
# gracefully degrades to "—" when missing. Install via:
#   pip install xu-wiki[vision]
vision = [
    "Pillow>=10.0",
]

[project.scripts]
xu = "xu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xu.skills" = [
    "SKILL.md",
    "create.md",
    "ingest.md",
    "query.md",
    "doctor.md",
    "config.md",
    "INSTALL.md",
    "reference/error-catalog.md",
    "reference/pitfalls.md",
]

[tool.xu-wiki]
marker = "xu-wiki-project"
