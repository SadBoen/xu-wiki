[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xu-wiki"
version = "0.1.0"
description = "Relation-driven wiki engine for AI agents: Page (knowledge) + Entity/List/Report (learning)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf   = ["markitdown[all]"]
parse = ["markitdown[all]"]
nlp   = []
vision = ["Pillow>=12.0"]
all   = ["markitdown[all]", "Pillow>=12.0"]

[project.scripts]
xu = "xu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
    "xu.skills" = [
        "SKILL.md",
        "references/lifecycle.md",
        "references/ingest.md",
        "references/query.md",
        "references/doctor.md",
        "references/config.md",
        "references/error-catalog.md",
    ]

[tool.xu-wiki]
marker = "xu-wiki-project"
